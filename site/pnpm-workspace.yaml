# Makes site/ its own pnpm root with its own lockfile. An install here never reads or changes
# the server's lockfile, so the server's audit gate and its bundles do not see the site's packages.
allowBuilds:
  esbuild: true
# Patched versions of vulnerable transitive build-time packages (pnpm audit). Remove an entry once
# its parent ships the fix.
overrides:
  fflate@>=0.7.0 <0.7.5: ^0.7.5 # satori (og image render) -> GHSA-px8p-9vwx-vf98
