blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/blen-labs/uspto-mcp-server/security/advisories/new
    about: Sandbox escapes, authentication bypasses and key leaks go to a private advisory, never a public issue.
  - name: Documentation
    url: https://uspto.mcp.blenlabs.com/docs/
    about: Connect guides, key setup, recipes and the SDK reference. Check here before you open an issue.
  - name: USPTO account or API key problems
    url: https://data.uspto.gov/support/universal-registration
    about: Registration, ID.me verification and key activation are handled by USPTO, not by this project.
