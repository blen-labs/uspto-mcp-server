name: release

# Continuous release: every push to main is released, after the complete CI gates pass on that
# exact commit. scripts/release.mjs computes the next SemVer from the conventional commits since
# the last tag (breaking -> major, feat -> minor, anything else -> patch; the first release of a
# repository with no tags publishes the version package.json declares), stamps package.json and
# the x-release-version markers, and writes the CHANGELOG section.
#
# Least privilege, three jobs:
#   gates   - read-only: the full CI workflow (tests incl. Postgres + both sandboxes, Docker, MCPB).
#   cut     - contents: write. Installs with --ignore-scripts, stamps, builds, packs the tarball
#             and the Claude Desktop bundle, pushes the chore(release) commit + tag, creates the
#             GitHub Release with both attached.
#   publish - id-token: write only. Never checks out or installs dependencies: it publishes the
#             exact tarball `cut` built, via npm trusted publishing (OIDC), with provenance. No npm
#             token exists; only this workflow, in the main-only `npm` environment, can publish.
#
# The release commit is pushed as the org's release GitHub App (the ruleset's only bypass actor),
# because main's ruleset requires PRs and GITHUB_TOKEN cannot be a bypass actor. The app's key
# lives in the `release` environment (deployable from main only); the job mints a short-lived
# token scoped to this repository with contents:write just before the push and uses it only there.
# No-loop guarantee: app-token pushes DO trigger workflows, so the release commit's own run
# skips `gates` (and therefore everything else) by its `chore(release):` subject, and
# scripts/release.mjs ignores chore(release) commits (released=false; test/release.spec.ts).
# If another commit lands on main mid-run, the release push is rejected and this run fails;
# the newer push's run releases both.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: 'Recovery only: re-run gates and publish the CURRENT version to npm (no bump, no tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  gates:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    uses: ./.github/workflows/ci.yml

  cut:
    needs: gates
    runs-on: ubuntu-latest
    environment: release # holds the release app's key; deployments restricted to main
    permissions:
      contents: write # GitHub Release (the commit and tag are pushed as the release app)
    outputs:
      released: ${{ steps.cut.outputs.released || (inputs.republish && 'true') || 'false' }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags: the bump is computed from commits since the last tag
          persist-credentials: false # nothing below pushes with GITHUB_TOKEN; see the final step
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # No dependency lifecycle scripts run in a job that can push to the repository.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compute version, stamp files, write CHANGELOG section
        id: cut
        if: ${{ !inputs.republish }}
        run: node scripts/release.mjs
      # Build AFTER stamping so dist/ carries the released version strings.
      - run: pnpm build
      - name: Pack the exact artifact to publish
        run: |
          npm pack --ignore-scripts
          node -e "const v=require('./package.json').version; if(!require('fs').existsSync('blen-uspto-mcp-server-'+v+'.tgz')) process.exit(1)"
          grep -q "version: '$(node -p 'require("./package.json").version')'" dist/server/mcpServer.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: blen-uspto-mcp-server-*.tgz
          if-no-files-found: error
      # From the same stamped build as the tarball, so the bundle carries the released version.
      # mcpb:prepare installs the bundle's production dependencies with --ignore-scripts.
      - name: Build the Claude Desktop bundle
        if: steps.cut.outputs.released == 'true'
        run: pnpm mcpb:prepare && pnpm mcpb:pack && test -s uspto-mcp-server.mcpb
      - name: Mint a short-lived token for the release push
        id: app-token
        if: steps.cut.outputs.released == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit, tag, and create the GitHub Release
        if: steps.cut.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.cut.outputs.version }}
          NOTES_FILE: ${{ steps.cut.outputs.notes_file }}
          BUMP: ${{ steps.cut.outputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMP" != "initial" ]; then
            git add package.json CHANGELOG.md src/server/mcpServer.ts src/sdk/bindings.ts
            git commit -m "chore(release): v${VERSION}"
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          # Push as the release app (the ruleset's only bypass actor). The token is passed as a
          # one-off header, never stored in .git/config, and repository hooks are disabled.
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}" # the base64 form is not covered by the token's own mask
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push "https://github.com/${REPO}.git" HEAD:main --follow-tags
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "${NOTES_FILE}" blen-uspto-mcp-server-*.tgz uspto-mcp-server.mcpb

  publish:
    needs: cut
    if: needs.cut.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: npm # deployments restricted to main; the npm trusted publisher names this environment
    permissions:
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
      # Trusted publishing needs npm CLI >= 11.5.1. PINNED: this job holds publish rights, and an
      # unpinned npm@latest would run with them. Bump deliberately.
      - name: Publish to npm (trusted publishing, with provenance)
        run: |
          npm install -g npm@12.0.2
          npm publish ./blen-uspto-mcp-server-*.tgz --access public --provenance
