name: security

# Daily dependency audit of the unchanged lockfiles. CI audits only when something is pushed, so
# an advisory published against a quiet main would otherwise surface first as an unrelated PR
# failing its audit gate. This also checks that every `auditConfig.ignoreGhsas` exception still
# deserves its place (scripts/check-audit-exceptions.mjs): it fails once the advisory is
# withdrawn or gets a fix. A failed run opens (or comments on) one tracking issue; the fix itself
# lands through a normal PR (a Dependabot security update, an `overrides:` entry in
# pnpm-workspace.yaml, or a removed exception), never from this workflow.
#
# Nothing is installed: `pnpm audit` reads only the lockfile, so no dependency code runs here.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the tracking issue on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Audit the server (same gate as CI)
        run: pnpm audit --audit-level moderate
      - name: Audit the documentation site
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level moderate
        working-directory: site
      - name: Audit exceptions still unpatched
        if: ${{ !cancelled() }}
        run: node scripts/check-audit-exceptions.mjs . site
      - name: Open or update the tracking issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Scheduled dependency audit is failing'
          body="The scheduled audit failed: $RUN_URL

          Fix it with a PR: merge the Dependabot security update if one is open, otherwise update the package or add an \`overrides:\` entry in \`pnpm-workspace.yaml\`. If an \`auditConfig.ignoreGhsas\` exception was flagged, remove it (and its row in \`test/audit-exceptions.spec.ts\`). Close this issue once the workflow passes again."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
